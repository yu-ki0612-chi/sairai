<body class="contact_page">
    <header>

        <header id="header">
            <div class="contact_header">
                <div class="header_logo"><a href="./index.html"><img src="image_PF/logo_lilac.svg" alt="ロゴ"></a>
                    <div class="contact_wrap">
                        <h2 class="contact_title">CONTACT</h2>
                        <div class="contact_lead">

                            <p class="contact_text1">ちょっとした内容でも問題ございません。<br>
                                お気軽にご相談ください。</p>
                        </div>
                        <div class="contact_lead">

                            <p class="contact_text2">※お問い合わせ内容に関しては3営業日以内に返信<br>いたします。</p>
                        </div>
                    </div>


        </header>
        <!-- コンタクト内容 -->
        <section id="contact" class="contact_page_wrap">
            <div class="contact_container">

                <!-- お問い合わせフォーム -->
                <form
                    action="https://docs.google.com/forms/d/e/1FAIpQLSetGdYp2N_OwhvT3w-z9LinwAVbB_xeNYdKjpxfRNvxmGyHDg/viewform?usp=header"
                    method="POST" target="hidden_iframe" onsubmit="submitted=true" class="contact_form">
                    <div class="form_block">
                        <label for="name">お名前</label>
                        <input type="text" name="entry.922778743" id="name" placeholder="デザイン 彩" class="form_field"
                            required>

                    </div>
                    <div class="form_block">
                        <label for="email">メールアドレス</label>
                        <input type="email" name="entry." id="email" placeholder="design@jp" class="form_field"
                            required>
                    </div>
                    <div class="form_block">
                        <label for="inqury">ご依頼内容</label>
                        <textarea name="entry." id="inqury" placeholder="（例）デザイン制作について"
                            class="form_field inqury_field"></textarea>
                    </div>



                    <!-- 送信ボタン -->
                    <div class="contact_send">
                        <button type="submit" class="contact_send_btn">送信</button>
                    </div>
                    <script type="text/JavaScript">let submitted=false;</script>
                    <iframe name="hidden_iframe" id="hidden_iframe" style="display: none;"
                        onload="if(submitted){window.location='.thanks.html';}">#document(about:blank)</iframe>
            </div>
            </form>
        </section>

        <!-- ナビゲーションメニュー固定 -->
        <div class="l_header_right">
            <nav class="nav_scrolled">
                <ul>
                    <li><a href="#header">HOME</a></li>
                    <li><a href="#about">ABOUT</a></li>
                    <li><a href="#works">WORKS</a></li>
                    <li><a href="#contact
                            ">CONTACT</a></li>
                    <li><img src="image_PF/instagram.svg" alt="instagram"></li>
                </ul>
            </nav>
        </div>

        <!-- Footer -->
        <footer class="footer_wrap">
            <div class="footer-container">
                <div class="fuwafuwa_lilac">
                </div>


                <p class="copyright">©sairai design</p>

        </footer>

</body>

</html>
